name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: dev
            url: https://dasigconnect-backend.onrender.com/health
          - name: prod
            url: https://api.dasigconnect.com/health
    steps:
      - name: GET /health (${{ matrix.target.name }})
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            "${{ matrix.target.url }}")
          echo "HTTP $code"
          test "$code" = "200"
