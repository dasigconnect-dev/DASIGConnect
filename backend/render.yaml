# Render Blueprint for the DASIGConnect backend (dev environment).
#
# Custom domain (api-dev.dasigconnect.com) and the plan are configured in the
# Render dashboard. Use at least the Starter plan — the free plan spins the
# service down when idle, which stops the every-minute publishing scheduler.
#
# `sync: false` = the value is a secret / environment-specific; set it in the
# Render dashboard, not in this file. Values written inline are non-secret.

services:
  - type: web
    name: dasigconnect-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # ── Database (Supabase Session Pooler) ──────────────────────────────
      - key: DASIG_DATABASE_URL
        sync: false
      - key: DASIG_DATABASE_USER
        sync: false
      - key: DASIG_DATABASE_PASSWORD
        sync: false
      # Optional — only for Claude Vision fetching Supabase-hosted images.
      - key: DASIG_SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ── Auth ───────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false

      # ── URLs ───────────────────────────────────────────────────────────
      - key: APP_FRONTEND_BASE_URL
        value: https://dev.dasigconnect.com
      - key: APP_GUARDRAILS_ENFORCED
        value: "true"

      # ── Email (Resend HTTP API) ────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: DASIGConnect
      - key: MAIL_REPLY_TO
        sync: false

      # ── Facebook Graph API ─────────────────────────────────────────────
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_API_VERSION
        value: v25.0
      - key: FACEBOOK_OAUTH_REDIRECT_URI
        value: https://api-dev.dasigconnect.com/api/v1/facebook/oauth-callback

      # ── External AI APIs ───────────────────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false

      # ── Cloudflare R2 object storage ───────────────────────────────────
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: dasigconnect-media
      - key: R2_PUBLIC_BASE_URL
        sync: false
