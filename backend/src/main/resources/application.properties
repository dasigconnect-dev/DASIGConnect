spring.application.name=backend

# Render (and most PaaS) inject the listen port via $PORT; fall back to 8080 locally.
server.port=${PORT:8080}
# Behind the Render / Cloudflare proxy: trust X-Forwarded-* so the app sees https.
server.forward-headers-strategy=framework

# gzip compressible responses (JSON/analytics/audit-log payloads especially) to cut
# egress bandwidth on the Render free tier. Media itself is proxied separately via
# MediaProxyController and is already compressed (JPEG/MP4/etc.), so it's excluded here.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript,text/javascript
server.compression.min-response-size=1024

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

spring.config.import=optional:dotenv:.env,optional:dotenv:backend/.env,optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Supabase PostgreSQL connection via Session Pooler
# Prefer DASIG_* locally to avoid collisions with system/provider DATABASE_URL values.
# Render and other deployments may still use the standard DATABASE_* names.
spring.datasource.url=${DASIG_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/dasigconnect}}
spring.datasource.username=${DASIG_DATABASE_USER:${DATABASE_USER:${DATABASE_USERNAME:postgres}}}
spring.datasource.password=${DASIG_DATABASE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP pool settings optimized for Supabase Session Pooler
# Session pooler has connection limits, so use smaller pool sizes
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.leak-detection-threshold=20000

# JPA/Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
# Disable Open-in-View: prevents EntityManager (and DB connection) being held for SSE stream lifetime
spring.jpa.open-in-view=false
# Disable Open-in-View: prevents EntityManager (and DB connection) being held for SSE stream lifetime
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:0}
spring.flyway.out-of-order=true

# Transactional email via an HTTP mail API (Resend-compatible). No SMTP.
app.mail.api-key=${RESEND_API_KEY:}
app.mail.api-base-url=${MAIL_API_BASE_URL:https://api.resend.com}
app.mail.from=${MAIL_FROM:no-reply@dasigconnect.local}
app.mail.from.name=${MAIL_FROM_NAME:DASIGConnect}
app.mail.reply-to=${MAIL_REPLY_TO:${MAIL_FROM:no-reply@dasigconnect.local}}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.mail.smoke-test.to=${MAIL_SMOKE_TEST_TO:}

# Supabase Postgres stays; service-role-key is only still read by ClaudeVisionClient
# as a legacy fallback for images that live on the old private Supabase bucket.
app.supabase.service-role-key=${DASIG_SUPABASE_SERVICE_ROLE_KEY:${SUPABASE_SERVICE_ROLE_KEY:}}

# Media object storage — any S3-compatible endpoint (currently Cloudflare R2).
# Media is uploaded browser-direct via a presigned PUT URL. Reads go straight to
# app.r2.custom-domain-url when set (a real domain attached to the R2 bucket via
# Cloudflare's Custom Domains feature — zero egress cost, zero backend bandwidth);
# otherwise they fall back through this backend's own proxy (MediaProxyController /
# app.backend.public-base-url). Do NOT set custom-domain-url to R2's pub-*.r2.dev
# "Public Development URL" — Cloudflare documents that host as unfit for production
# and it can rotate/disappear without notice; see MediaStorageService's class
# javadoc for the incident that caused this whole design. app.r2.public-base-url is
# now only used to recognize old stored URLs from before the proxy was introduced.
# Config keys stay under app.r2.* / R2_* as the stable namespace.
app.r2.account-id=${R2_ACCOUNT_ID:}
app.r2.endpoint=${R2_ENDPOINT:}
app.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.r2.bucket=${R2_BUCKET:dasigconnect-media}
app.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
app.r2.custom-domain-url=${R2_CUSTOM_DOMAIN_URL:}

# This backend's own publicly-reachable base URL (no trailing slash), used to build
# media proxy URLs stored in media_assets.storage_url. In production this must be
# set to the backend's real public origin (e.g. the Render service URL or a custom
# API domain) — the localhost default only works for local dev.
app.backend.public-base-url=${BACKEND_PUBLIC_BASE_URL:http://localhost:8080}

# System Health storage budgets. "used" is measured live (Postgres pg_database_size;
# object-store ListObjectsV2 sweep, cached 10 min, DB-sum fallback). The limits are the
# points past which the plan starts charging / restricting, so % is measured against them.
# Defaults track the current free tiers: Supabase Postgres 500 MB, Cloudflare R2 10 GB.
# WARNING at 80%, UNHEALTHY at 95% (bump these env vars after a plan upgrade).
app.system-health.database-limit-bytes=${SYSTEM_HEALTH_DATABASE_LIMIT_BYTES:500000000}
app.system-health.media-limit-bytes=${SYSTEM_HEALTH_MEDIA_LIMIT_BYTES:10000000000}
app.system-health.storage-warning-threshold-percent=${SYSTEM_HEALTH_STORAGE_WARNING_THRESHOLD_PERCENT:80}
app.system-health.storage-critical-threshold-percent=${SYSTEM_HEALTH_STORAGE_CRITICAL_THRESHOLD_PERCENT:95}

# Media asset deletion lifecycle: soft delete immediately, purge AI/storage after retention.
app.media-assets.deleted-retention-days=${MEDIA_ASSET_DELETED_RETENTION_DAYS:30}
app.media-assets.purge-batch-size=${MEDIA_ASSET_PURGE_BATCH_SIZE:25}
app.media-assets.purge-cron=${MEDIA_ASSET_PURGE_CRON:0 30 2 * * *}

# Media asset deletion lifecycle: soft delete immediately, purge AI/storage after retention.
app.media-assets.deleted-retention-days=${MEDIA_ASSET_DELETED_RETENTION_DAYS:30}
app.media-assets.purge-batch-size=${MEDIA_ASSET_PURGE_BATCH_SIZE:25}
app.media-assets.purge-cron=${MEDIA_ASSET_PURGE_CRON:0 30 2 * * *}

# Generated watermark derivatives (UC-2.5) are transient publish-time R2 objects
# outside the media_assets retention lifecycle above -- Facebook only ever fetches
# the URL once, at publish time, so a short retention window is safe.
app.watermark.generated-retention-days=${WATERMARK_GENERATED_RETENTION_DAYS:3}
app.watermark.purge-cron=${WATERMARK_PURGE_CRON:0 45 2 * * *}

# Audit log tiered retention: prune high-volume operational rows (sign-ins, uploads,
# routine submission edits, background-job markers) after this window. Security,
# account/role, erasure, institution, override, and export events are kept forever.
app.audit.retention.operational-days=${AUDIT_RETENTION_OPERATIONAL_DAYS:730}
app.audit.retention.prune-cron=${AUDIT_RETENTION_PRUNE_CRON:0 45 3 * * *}

# Testing toggle: keep guard rail checks visible, but do not block draft/save/submit unless enabled.
app.guardrails.enforced=${APP_GUARDRAILS_ENFORCED:false}
app.db-diagnostics.enabled=${APP_DB_DIAGNOSTICS_ENABLED:false}

# Administrative policy: maximum number of active admin accounts network-wide.
app.admins.max=${APP_ADMINS_MAX:3}

# Review governance (A10): fraction of caption words a moderator may change across
# a whole review session before the edit is classified FLAGGED instead of QUIET.
app.review.caption-major-change-ratio=${APP_REVIEW_CAPTION_MAJOR_CHANGE_RATIO:0.30}

app.jwt.secret=${JWT_SECRET:dev-only-change-me}
app.jwt.access-token-ttl-minutes=${JWT_TTL_MINUTES:480}

# Facebook Graph API — UC-3.1 Publishing Pipeline
app.facebook.page-access-token=${FACEBOOK_PAGE_ACCESS_TOKEN:}
app.facebook.page-id=${FACEBOOK_PAGE_ID:}
app.facebook.app-id=${FACEBOOK_APP_ID:}
app.facebook.app-secret=${FACEBOOK_APP_SECRET:}
app.facebook.api-version=${FACEBOOK_API_VERSION:v25.0}
# Defaults off app.backend.public-base-url (already env-correct per deploy) instead of
# hardcoding localhost — a deploy that forgets FACEBOOK_OAUTH_REDIRECT_URI now still
# builds the right Authorize URL instead of silently sending admins to localhost:8080.
app.facebook.oauth-redirect-uri=${FACEBOOK_OAUTH_REDIRECT_URI:${app.backend.public-base-url}/api/v1/facebook/oauth-callback}
# Post-reach insight metrics tried in order by SocialEngagementSync (comma-separated).
# Leave blank to skip the /insights reach call entirely. Meta removes/renames these per
# API version — set to whatever GET /{post-id}/insights reports as valid for your Page.
app.facebook.reach-metrics=${FACEBOOK_REACH_METRICS:post_impressions_unique}
# Page-level insight metrics for the admin "Page Performance" card, summed over the
# selected range from GET /{page-id}/insights?period=day. Blank disables the card.
# Recognised names: page_impressions_unique, page_post_engagements, page_fan_adds, page_views_total.
app.facebook.page-insight-metrics=${FACEBOOK_PAGE_INSIGHT_METRICS:page_impressions_unique,page_post_engagements,page_fan_adds,page_views_total}

# Anthropic Claude Vision API — UC-3.2 Caption Generation
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}

# Voyage AI — UC-3.3 Embedding Generation
voyage.api.key=${VOYAGE_API_KEY:}

# Durable, bounded media AI processing. Keep the batch below the five-connection
# database pool limit; provider calls run after the queue claim transaction ends.
app.media-processing.batch-size=${MEDIA_PROCESSING_BATCH_SIZE:2}
app.media-processing.max-attempts=${MEDIA_PROCESSING_MAX_ATTEMPTS:5}
app.media-processing.lease-seconds=${MEDIA_PROCESSING_LEASE_SECONDS:300}
app.media-processing.poll-delay-ms=${MEDIA_PROCESSING_POLL_DELAY_MS:5000}
app.media-processing.reconcile-delay-ms=${MEDIA_PROCESSING_RECONCILE_DELAY_MS:300000}

# Facebook Messenger — UC-3.3 Automated Reminders & Alerts
app.messenger.enabled=${MESSENGER_ENABLED:true}
app.messenger.page-id=${MESSENGER_PAGE_ID:${FACEBOOK_PAGE_ID:}}
app.messenger.page-access-token=${MESSENGER_PAGE_ACCESS_TOKEN:${FACEBOOK_PAGE_ACCESS_TOKEN:}}
app.messenger.app-secret=${MESSENGER_APP_SECRET:${FACEBOOK_APP_SECRET:}}
app.messenger.verify-token=${MESSENGER_VERIFY_TOKEN:${FACEBOOK_MESSENGER_VERIFY_TOKEN:}}
app.messenger.api-version=${MESSENGER_API_VERSION:v25.0}

# Add this at the end for production logging
logging.level.root=INFO
logging.level.com.dasigconnect=INFO
logging.level.org.flywaydb=INFO
