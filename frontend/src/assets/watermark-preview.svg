<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" fill="none">
  <defs>
    <!-- Sky & Atmosphere -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Warm Ambient Sun -->
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#FEF08A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0"/>
    </radialGradient>

    <!-- Building Facade Gradients -->
    <linearGradient id="facadeGrad" x1="200" y1="300" x2="800" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="plazaGrad" x1="0" y1="660" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1000" height="1000" fill="url(#skyGrad)"/>

  <!-- Sun & Atmospheric Glow -->
  <circle cx="820" cy="180" r="140" fill="url(#sunGlow)"/>
  <circle cx="820" cy="180" r="48" fill="#FDE047" opacity="0.85"/>

  <!-- Soft Mountain / Distant Trees Silhouette -->
  <path d="M0 600 Q250 560 500 590 T1000 580 L1000 660 L0 660 Z" fill="#94A3B8" opacity="0.25"/>
  <ellipse cx="140" cy="620" rx="160" ry="45" fill="#86EFAC" opacity="0.35"/>
  <ellipse cx="880" cy="630" rx="180" ry="50" fill="#6EE7B7" opacity="0.3"/>

  <!-- Ground / Modern Plaza -->
  <rect x="0" y="660" width="1000" height="340" fill="url(#plazaGrad)"/>
  <rect x="0" y="660" width="1000" height="6" fill="#94A3B8" opacity="0.5"/>

  <!-- Building Cast Shadow on Ground -->
  <polygon points="170,666 830,666 870,740 130,740" fill="#0F172A" opacity="0.06"/>

  <!-- Main Architectural Structure -->
  <!-- Main Facade -->
  <rect x="200" y="330" width="600" height="330" rx="6" fill="url(#facadeGrad)"/>

  <!-- Dark Architectural Overhang / Cornice -->
  <rect x="180" y="310" width="640" height="24" rx="4" fill="#1E293B"/>
  <rect x="195" y="334" width="610" height="6" fill="#0F172A" opacity="0.15"/>

  <!-- Upper Story Ribbon Windows -->
  <rect x="240" y="365" width="520" height="80" rx="3" fill="#0F172A"/>
  <g fill="url(#glassGrad)">
    <rect x="246" y="371" width="120" height="68" rx="2"/>
    <rect x="374" y="371" width="120" height="68" rx="2"/>
    <rect x="502" y="371" width="120" height="68" rx="2"/>
    <rect x="630" y="371" width="124" height="68" rx="2"/>
  </g>
  <!-- Window Glass Highlights -->
  <polygon points="320,371 300,439 316,439 336,371" fill="#FFFFFF" opacity="0.25"/>
  <polygon points="578,371 558,439 574,439 594,371" fill="#FFFFFF" opacity="0.25"/>

  <!-- Lower Level Glass Atrium & Colonnade Entrance -->
  <rect x="240" y="475" width="520" height="185" rx="3" fill="#1E293B"/>
  <rect x="246" y="481" width="508" height="173" rx="2" fill="url(#glassGrad)"/>

  <!-- Minimalist Architectural Columns -->
  <g fill="#FFFFFF">
    <rect x="270" y="475" width="18" height="185" rx="1"/>
    <rect x="380" y="475" width="18" height="185" rx="1"/>
    <rect x="490" y="475" width="18" height="185" rx="1"/>
    <rect x="600" y="475" width="18" height="185" rx="1"/>
    <rect x="710" y="475" width="18" height="185" rx="1"/>
  </g>
  <!-- Column Shadows -->
  <g fill="#0F172A" opacity="0.15">
    <rect x="288" y="475" width="6" height="185"/>
    <rect x="398" y="475" width="6" height="185"/>
    <rect x="508" y="475" width="6" height="185"/>
    <rect x="618" y="475" width="6" height="185"/>
    <rect x="728" y="475" width="6" height="185"/>
  </g>

  <!-- Central Double Entry Doors -->
  <rect x="455" y="555" width="90" height="105" rx="2" fill="#0F172A" opacity="0.5"/>
  <rect x="459" y="559" width="39" height="97" rx="1" fill="#E0F2FE" opacity="0.4"/>
  <rect x="502" y="559" width="39" height="97" rx="1" fill="#E0F2FE" opacity="0.4"/>
  <!-- Modern Handles -->
  <rect x="491" y="600" width="3" height="22" rx="1" fill="#F8FAFC"/>
  <rect x="506" y="600" width="3" height="22" rx="1" fill="#F8FAFC"/>

  <!-- Left Minimalist Botanical Accent -->
  <rect x="110" y="540" width="6" height="120" rx="2" fill="#64748B"/>
  <circle cx="113" cy="500" r="50" fill="#10B981" opacity="0.9"/>
  <circle cx="95" cy="515" r="32" fill="#059669" opacity="0.8"/>
  <circle cx="132" cy="515" r="30" fill="#34D399" opacity="0.85"/>

  <!-- Right Modern Planter Accent -->
  <rect x="850" y="615" width="70" height="45" rx="3" fill="#FFFFFF"/>
  <rect x="850" y="655" width="70" height="5" fill="#CBD5E1"/>
  <ellipse cx="885" cy="610" rx="30" ry="18" fill="#10B981" opacity="0.9"/>
  <ellipse cx="885" cy="605" rx="20" ry="14" fill="#34D399" opacity="0.8"/>

  <!-- Plaza Perspective Tile Lines -->
  <line x1="80" y1="1000" x2="300" y2="666" stroke="#94A3B8" stroke-width="1.5" opacity="0.35"/>
  <line x1="500" y1="1000" x2="500" y2="666" stroke="#94A3B8" stroke-width="1.5" opacity="0.35"/>
  <line x1="920" y1="1000" x2="700" y2="666" stroke="#94A3B8" stroke-width="1.5" opacity="0.35"/>
  <line x1="0" y1="780" x2="1000" y2="780" stroke="#94A3B8" stroke-width="1.5" opacity="0.3"/>
  <line x1="0" y1="890" x2="1000" y2="890" stroke="#94A3B8" stroke-width="1.5" opacity="0.25"/>
</svg>